name: build-and-deploy
on:
  push:
    branches: [main]
    tags: ['v*']
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { svc: [web, api] } # worker reuses the api image with a different command
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kolife-${{ matrix.svc }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.svc }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy staging
        # Dokploy API (works with Autodeploy off). Tunnel exposes only /api/compose.deploy.
        env:
          KEY: '${{ secrets.DOKPLOY_STAGING_API_KEY }}'
          COMPOSE_ID: '${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}'
        run: |
          if [ -z "$KEY" ] || [ -z "$COMPOSE_ID" ]; then echo "staging deploy secrets not set, skipping"; exit 0; fi
          curl -sS --fail-with-body --proto =https -X POST "https://kolife-deploy.hakeemiridza.com/api/compose.deploy" \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$COMPOSE_ID\"}"
  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy prod
        env: { HOOK: '${{ secrets.DOKPLOY_PROD_HOOK }}' }
        run: if [ -n "$HOOK" ]; then curl -sS --fail-with-body --proto =https -X POST "$HOOK"; else echo "DOKPLOY_PROD_HOOK not set, skipping"; fi
