server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 40m;

    # pass /api through unchanged; FastAPI routes are prefixed with /api
    # re-resolve `api` via Docker DNS: a redeployed api container gets a new IP,
    # and a static proxy_pass would keep the stale one (502 after every api-only deploy)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # SSE trace stream
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
