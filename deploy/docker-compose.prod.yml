# Dokploy: pulls GHCR images only, never builds. Secrets live in the Dokploy Environment tab;
# Dokploy passes them via --env-file, so they're interpolated as ${VAR} here.
services:
  web:
    image: ghcr.io/keirara04/kolife-web:${TAG:-main}
    depends_on: [api]
    restart: unless-stopped
  api:
    image: ghcr.io/keirara04/kolife-api:${TAG:-main}
    environment: &appenv
      META_API_KEY: ${META_API_KEY}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      ORCH_MODEL: ${ORCH_MODEL:-muse-spark-1.3}
      WORKER_MODEL: ${WORKER_MODEL:-muse-spark-1.3}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      SPEND_CAP_USD_TOTAL: ${SPEND_CAP_USD_TOTAL:-120}
      SPEND_CAP_USD_DAILY: ${SPEND_CAP_USD_DAILY:-20}
      DATABASE_URL: postgresql+asyncpg://kolife:${POSTGRES_PASSWORD}@postgres:5432/kolife
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    restart: unless-stopped
  worker:
    image: ghcr.io/keirara04/kolife-api:${TAG:-main}
    command: arq app.worker.WorkerSettings
    environment: *appenv
    depends_on: [postgres, redis]
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kolife
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
volumes: { pgdata: {} }
