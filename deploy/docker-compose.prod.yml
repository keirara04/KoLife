# Dokploy: pulls GHCR images only, never builds. Secrets live in the Dokploy environment.
services:
  web:
    image: ghcr.io/keirara04/kolife-web:${TAG:-main}
    depends_on: [api]
    restart: unless-stopped
  api:
    image: ghcr.io/keirara04/kolife-api:${TAG:-main}
    env_file: .env
    depends_on: [postgres, redis]
    restart: unless-stopped
  worker:
    image: ghcr.io/keirara04/kolife-api:${TAG:-main}
    command: arq app.worker.WorkerSettings
    env_file: .env
    depends_on: [postgres, redis]
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kolife
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
volumes: { pgdata: {} }
